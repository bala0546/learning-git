<div class="app-container">
  <header class="top">
    <!-- title removed as requested -->
    <nav>
      <a class="back" routerLink="/suppliers">← Back to suppliers</a>
    </nav>
  </header>

  <form #supplierForm="ngForm" (ngSubmit)="save(supplierForm)" class="form box" style="margin-top:1rem; display:block; max-width:720px; margin-left:auto; margin-right:auto;">
    <label>
      Name
      <input name="name" [(ngModel)]="model.name" #nameCtrl="ngModel" required />
      <div class="error" *ngIf="nameCtrl.invalid && (nameCtrl.dirty || nameCtrl.touched)">Name is required.</div>
    </label>

    <label>
      Contact
      <input name="contact" [(ngModel)]="model.contact" #contactCtrl="ngModel" required />
      <div class="error" *ngIf="contactCtrl.invalid && (contactCtrl.dirty || contactCtrl.touched)">Contact is required.</div>
    </label>

    <label>
      Email
      <input type="email" name="email" [(ngModel)]="model.email" #emailCtrl="ngModel" required email />
      <div class="error" *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)">
        <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
        <span *ngIf="emailCtrl.errors?.['email']">Enter a valid email address.</span>
      </div>
    </label>

    <label>
      Phone
      <input type="tel" inputmode="tel" name="phone" [(ngModel)]="model.phone" #phoneCtrl="ngModel" required pattern="^(\+91[-\s]?)?[6-9](?:[-\s]?[0-9]){9}$" title="Indian mobile number; allows spaces or hyphens (e.g. +91 98765 43210, 98765-43210, 9876543210)" maxlength="20" />
      <div class="error" *ngIf="phoneCtrl.invalid && (phoneCtrl.dirty || phoneCtrl.touched)">
        <span *ngIf="phoneCtrl.errors?.['required']">Phone is required.</span>
        <span *ngIf="phoneCtrl.errors?.['pattern']">Enter a valid phone number</span>
      </div>
    </label>

    <label>
      Address
      <input name="address" [(ngModel)]="model.address" #addressCtrl="ngModel" required />
      <div class="error" *ngIf="addressCtrl.invalid && (addressCtrl.dirty || addressCtrl.touched)">Address is required.</div>
    </label>

    <div style="margin-top:1rem; display:flex; gap:0.5rem;">
      <button type="submit" [disabled]="supplierForm.invalid">Save</button>
      <button (click)="cancel()" type="button">Cancel</button>
    </div>
  </form>
</div>
