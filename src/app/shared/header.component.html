<header class="header-bar">
  <div class="container">
    <!-- make brand clickable to route to dashboard; show only for admin users -->
    

    <nav class="main-nav" role="navigation" aria-label="Main navigation">
      <a *ngIf="role === 'admin'" routerLink="/" class="brand" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:1rem">
      <div class="logo" style="height: 50px; width: 70px; text-align: center; display: flex; align-items: center; justify-content: center;">IMS</div>
    </a>
      <!-- Products and Orders are available to all authenticated users -->
      <a routerLink="/products" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.6"/></svg>Products</a>
      <a routerLink="/orders" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7h18" stroke-width="1.6"/><path d="M7 7v14" stroke-width="1.6"/></svg>Orders</a>

      <!-- Admin-only links -->
      <a *ngIf="role === 'admin'" routerLink="/suppliers" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3" stroke-width="1.6"/><path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-width="1.6"/></svg>Suppliers</a>
      <a *ngIf="role === 'admin'" routerLink="/stock" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18" stroke-width="1.6"/><path d="M21 3l-6 6" stroke-width="1.6"/></svg>Stock</a>
      <a *ngIf="role === 'admin'" routerLink="/purchases" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7l3-7z" stroke-width="1.2"/></svg>Purchases</a>
      <a *ngIf="role === 'admin'" routerLink="/reports" routerLinkActive="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3h18v18H3z" stroke-width="1.6"/></svg>Reports</a>
    </nav>

    <div class="controls" style="display:flex;align-items:center;gap:0.75rem">
      <div style="font-size:0.92rem;color:var(--muted)">Hello, {{ username }}</div>
      <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(90deg,var(--accent),var(--primary));box-shadow:0 6px 18px rgba(79,70,229,0.14);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">{{ (username || 'A')?.charAt(0)?.toUpperCase() }}</div>
      <button class="logout-btn" (click)="logout()" aria-label="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="logout-icon" aria-hidden="true"><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /><path d="M11 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" /></svg>
        Logout
      </button>
    </div>
  </div>
</header>
