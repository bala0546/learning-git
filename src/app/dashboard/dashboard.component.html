<div class="dashboard">
  <!-- Removed local header because a global fixed header is used. Keep a small page title. -->
  <div class="page-title" style="padding:0.5rem 0 0 0;">
    <h1>Inventory Dashboard</h1>
  </div>

  <section class="cards">
    <div class="card">
      <div class="card-icon" aria-hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" fill="none" stroke-width="1.6"/></svg>
      </div>
      <h3>Total products</h3>
      <p class="big">{{ animatedCounts.total }}</p>
      
    </div>

    <div class="card">
      <div class="card-icon pulse" aria-hidden>
        <svg viewBox="0 0 24 24"><path d="M12 2v6" stroke-width="1.6" fill="none" stroke="currentColor"/><path d="M6 10h12" stroke-width="1.6" fill="none" stroke="currentColor"/></svg>
      </div>
      <h3>Low stock</h3>
      <p class="big">{{ animatedCounts.lowStock }}</p>
    
    </div>

    <div class="card">
      <div class="card-icon" aria-hidden>
        <svg viewBox="0 0 24 24"><path d="M4 7h16" stroke-width="1.6" fill="none" stroke="currentColor"/><path d="M4 12h10" stroke-width="1.6" fill="none" stroke="currentColor"/></svg>
      </div>
      <h3>Categories</h3>
      <p class="big">{{ animatedCounts.categories }}</p>
      
    </div>

    <div class="card">
      <div class="card-icon" aria-hidden>
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3" stroke-width="1.6" fill="none" stroke="currentColor"/><path d="M2 20c0-3 3-6 6-6s6 3 6 6" stroke-width="1.6" fill="none" stroke="currentColor"/></svg>
      </div>
      <h3>Suppliers</h3>
      <p class="big">{{ animatedCounts.supplierCount }}</p>
     
    </div>

    <div class="card">
      <div class="card-icon" aria-hidden>
        <svg viewBox="0 0 24 24"><path d="M3 7h18" stroke-width="1.6" fill="none" stroke="currentColor"/><path d="M7 7v14" stroke-width="1.6" fill="none" stroke="currentColor"/></svg>
      </div>
      <h3>Orders</h3>
      <p class="big">{{ animatedCounts.orderCount }}</p>
      
    </div>

    <div class="card">
      <div class="card-icon" aria-hidden>
        <svg viewBox="0 0 24 24"><path d="M3 13h18" stroke-width="1.2" fill="none" stroke="currentColor"/><path d="M6 6h12l-1 6H7z" stroke-width="1.2" fill="none" stroke="currentColor"/></svg>
      </div>
      <h3>Purchases</h3>
      <p class="big">{{ animatedCounts.purchaseCount }}</p>
    
    </div>
  </section>

</div>
